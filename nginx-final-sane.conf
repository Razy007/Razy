server {
    listen 80;
    server_name pioneeracademy.academy www.pioneeracademy.academy;

    # SERVIR LE SITE STATIQUE (Plus de proxy vers port 5000)
    root /var/www/pioneer-academy;
    index index.html;

    # Redirection HTTPS (si géré par Certbot ailleurs, ou ici si activé)
    # Si SSL géré par Nginx directement, copiez les lignes SSL ici.
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API PROXY (Vers le Backend 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
