<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circle border -->
  <circle cx="32" cy="32" r="28" stroke="#FF8C00" stroke-width="2.5" fill="none"/>
  
  <!-- Pi symbol -->
  <g fill="#FF8C00">
    <rect x="16" y="26" width="32" height="4" rx="1"/>
    <rect x="20" y="26" width="6" height="24" rx="1"/>
    <rect x="38" y="26" width="6" height="24" rx="1"/>
  </g>
  
  <!-- Graduation cap -->
