    <!-- ⚠️ ORDRE CRITIQUE D'EXÉCUTION ⚠️ -->

    <!-- 1️⃣ Universal MessageChannel Polyfill (EN PREMIER, avant tout le reste) -->
    <script>
      /**
       * 🔧 Universal MessageChannel Polyfill
       * Doit s'exécuter AVANT React pour corriger l'erreur "Illegal constructor"
       *
       * Problème: Certains navigateurs bloquent new MessageChannel() que React Scheduler utilise
       * Solution: Tester MessageChannel et le remplacer par une version setTimeout si bloqué
       */
      (function () {
        "use strict";

        console.log("🔧 Universal MessageChannel polyfill initializing...");

        // TOUJOURS tester MessageChannel (pas seulement dans Pi Browser)
        if (typeof MessageChannel !== "undefined") {
          try {
            // Tester si MessageChannel fonctionne
            const test = new MessageChannel();
            test.port1.close();
            test.port2.close();
            console.log("✅ MessageChannel works natively");
          } catch (err) {
            console.warn(
              "⚠️ MessageChannel blocked, installing polyfill...",
              err.message,
            );

            // Remplacer MessageChannel par une version compatible
            window.MessageChannel = function () {
              const channel = {
                port1: {
                  onmessage: null,
                  postMessage: function (data) {
                    if (channel.port2.onmessage) {
                      setTimeout(
                        () => channel.port2.onmessage({ data: data }),
                        0,
                      );
                    }
                  },
                  close: function () {},
                  start: function () {},
                },
                port2: {
                  onmessage: null,
                  postMessage: function (data) {
                    if (channel.port1.onmessage) {
                      setTimeout(
                        () => channel.port1.onmessage({ data: data }),
                        0,
                      );
                    }
                  },
                  close: function () {},
                  start: function () {},
                },
              };
              return channel;
            };

            console.log("✅ MessageChannel polyfill installed");
          }
        }

        console.log("✅ Polyfill ready");
      })();
    </script>
