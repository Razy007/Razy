<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title"></title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <h1 data-i18n="heading"></h1>
  <p data-i18n="intro"></p>

  <button onclick="setLanguage('fr')">Français</button>
  <button onclick="setLanguage('en')">English</button>

  <script>
    const translations = {
      fr: {
        title: "Diagnostic Pioneer Academy",
        heading: "Bienvenue sur Pioneer Academy",
        intro: "Évaluez votre niveau et progressez."
      },
      en: {
        title: "Pioneer Academy Diagnostic",
        heading: "Welcome to Pioneer Academy",
        intro: "Assess your level and improve your skills."
      }
    };

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.title = translations[lang].title;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        el.textContent = translations[lang][key];
      });

      localStorage.setItem("lang", lang);
    }

    // Langue initiale
    const userLang =
      localStorage.getItem("lang") ||
      navigator.language.slice(0, 2) ||
      "fr";

    setLanguage(userLang);
  </script>

</body>
</html>
